<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FWT Tools</title>
<link rel="icon" type="image/svg+xml" href="public/logo.svg">
<link rel="stylesheet" href="shared/tokens.css">
<script src="shared/theme.js"></script>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; font-family: var(--sans); font-size: 14px;
        background: var(--bg); color: var(--ink);
    }
    main { max-width: 760px; margin: 0 auto; padding: 72px 24px; }
    h1 { margin: 0 0 28px; font-size: 24px; letter-spacing: -0.4px; }
    h1 span { color: var(--muted); font-weight: 400; }
    .sub { margin: 0 0 32px; color: var(--muted); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .tile {
        display: flex; gap: 14px; align-items: flex-start; padding: 18px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
        color: inherit; text-decoration: none;
    }
    a.tile:hover, a.tile:focus-visible { border-color: var(--accent); outline: none; }
    .tile.soon { opacity: .6; }
    .mark {
        width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px;
        object-fit: contain; display: flex; align-items: center; justify-content: center;
        background: var(--accent-soft); font-weight: 700; font-size: 17px; color: var(--ink);
    }
    .tile b { display: block; font-size: 15px; margin-bottom: 3px; }
    .tile p { margin: 0; color: var(--muted); line-height: 1.45; }
    .badge {
        display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 100px;
        font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
        line-height: 16px; color: var(--muted); border: 1px solid var(--line);
        vertical-align: 1px;
    }
</style>
</head>
<body>
<main>
    <h1>FWT <span>Tools</span></h1>
    <div class="tiles" id="tiles"></div>
    <noscript><p><a href="apps/email/">Open the Email Kit</a></p></noscript>
</main>

<script src="shared/apps.js"></script>
<script>
    /* Before this was a launcher the root was the email composer, so a bookmark
     * like /#/t/<id> may still be out there. Anything carrying a route goes
     * straight to the email tool with the hash intact. */
    if (/^#\//.test(location.hash)) {
        location.replace('apps/email/' + location.hash);
    }

    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    document.getElementById('tiles').innerHTML = APPS.map(function (app) {
        var mark = app.icon
            ? '<img class="mark" src="' + esc(app.icon) + '" alt="" width="40" height="40">'
            : '<span class="mark" aria-hidden="true">' + esc(app.name.charAt(0)) + '</span>';
        var body = '<div><b>' + esc(app.name) +
            (app.soon ? '<span class="badge">Soon</span>' : '') + '</b>' +
            '<p>' + esc(app.desc) + '</p></div>';
        return app.soon
            ? '<div class="tile soon" aria-disabled="true">' + mark + body + '</div>'
            : '<a class="tile" href="' + esc(app.href) + '">' + mark + body + '</a>';
    }).join('');
</script>
</body>
</html>
