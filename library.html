<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Library</title>
<style>
    /* Greyscale by design — see the note in index.html. The accent is ink, so
     * nothing here competes with the email in the preview pane. */
    :root {
        --bg: #f5f6f8; --panel: #ffffff; --ink: #16181d; --muted: #737a85;
        --line: #e4e7ec; --accent: #16181d; --accent-soft: #eceef1;
        --on-accent: #ffffff;
        --live: #15803d; --live-soft: #f0f7f2; --live-line: #c2e2cc;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #14161a; --panel: #1c1f25; --ink: #e8eaed; --muted: #99a0aa;
            --line: #2c3037; --accent: #e8eaed; --accent-soft: #2a2f37;
            --on-accent: #14161a;
            --live: #57c98a; --live-soft: #18271e; --live-line: #2f4a39;
        }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0; font-family: var(--sans); background: var(--bg); color: var(--ink);
        font-size: 14px; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
        display: flex; align-items: center; gap: 12px; padding: 13px 18px;
        background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0;
    }
    .brand { font-weight: 700; letter-spacing: -0.3px; font-size: 15px; }
    .brand span { color: var(--muted); font-weight: 400; }
    .spacer { flex: 1; }
    input[type="search"] {
        font: inherit; font-size: 13.5px; padding: 7px 11px; border: 1px solid var(--line);
        border-radius: 8px; background: var(--panel); color: var(--ink); width: 240px;
    }
    button {
        font: inherit; font-size: 13.5px; padding: 7px 13px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
    button.primary:hover { opacity: .9; color: var(--on-accent); }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; padding: 6px 13px; font-size: 12.5px; }
    .seg button.on { background: var(--accent); color: var(--on-accent); }
    /* Icon-only. Each button keeps a title and an aria-label, because there is
       no longer a word to read. */
    .seg.icons button {
        padding: 0; width: 40px; height: 30px;
        display: inline-flex; align-items: center; justify-content: center;
    }
    .seg.icons svg {
        width: 16px; height: 16px; display: block;
        fill: none; stroke: currentColor; stroke-width: 1.4;
        stroke-linecap: round; stroke-linejoin: round;
    }

    main { display: flex; flex: 1; min-height: 0; }
    .list {
        width: 300px; border-right: 1px solid var(--line); background: var(--panel);
        overflow-y: auto; flex-shrink: 0; padding: 8px;
    }
    .grp {
        font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
        color: var(--muted); padding: 14px 10px 6px;
    }
    .row { padding: 10px 11px; border-radius: 8px; cursor: pointer; }
    .row:hover { background: var(--accent-soft); }
    .row.on { background: var(--accent-soft); }
    .row .n { font-size: 13.5px; font-weight: 500; }
    .row .d { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

    /* Read-only mirror of the composer's live switch. Green is a status, not a
       brand colour — the rest of this page is deliberately greyscale. */
    .live {
        display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 100px;
        font-size: 9.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
        line-height: 15px; color: var(--live); background: var(--live-soft);
        border: 1px solid var(--live-line); white-space: nowrap;
    }

    .detail { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .bar {
        display: flex; align-items: center; gap: 10px; padding: 9px 16px;
        background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0;
    }
    .view { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 22px; }
    iframe { border: 0; background: transparent; width: 700px; min-height: 620px; height: 100%; transition: width .18s; }
    iframe.mobile { width: 400px; }
    pre {
        flex: 1; overflow: auto; margin: 0; padding: 18px; font-family: var(--mono);
        font-size: 11.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    }
    .chips { padding: 16px 18px; overflow-y: auto; }
    .chip {
        display: inline-block; font-family: var(--mono); font-size: 11px; padding: 3px 8px;
        background: var(--accent-soft); color: var(--accent); border-radius: 6px; margin: 0 4px 4px 0;
    }
    .empty { color: var(--muted); text-align: center; padding: 60px 24px; line-height: 1.7; }
    .meta { font-size: 12px; color: var(--muted); }

    /* The handover table: what engineering must supply, and what the template's
       author says each one should look like. */
    table.vars { border-collapse: collapse; width: 100%; max-width: 720px; }
    table.vars th {
        text-align: left; font-size: 10.5px; text-transform: uppercase;
        letter-spacing: .6px; color: var(--muted); font-weight: 700;
        padding: 0 12px 8px 0; border-bottom: 1px solid var(--line);
    }
    table.vars td {
        padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line);
        font-size: 13px; vertical-align: top;
    }
    table.vars code { font-family: var(--mono); font-size: 11.5px; color: var(--ink); }
    table.vars td.nx { color: var(--muted); }
    table.vars td.nx em { font-style: normal; font-size: 11px; }
</style>
</head>
<body>

<header>
    <div class="brand">Email <span>Library</span></div>
    <div class="spacer"></div>
    <span class="meta" id="count"></span>
    <button id="reload">Reload</button>
</header>

<main>
    <nav class="list" id="list"><div class="empty">Loading…</div></nav>
    <section class="detail">
        <div class="bar" id="bar" style="display:none">
            <div class="seg icons" role="group" aria-label="View">
                <button id="vPreview" class="on" title="Preview" aria-label="Preview">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.4 8s2.5-4.4 6.6-4.4S14.6 8 14.6 8s-2.5 4.4-6.6 4.4S1.4 8 1.4 8z"/><circle cx="8" cy="8" r="1.9"/></svg>
                </button>
                <button id="vHtml" title="HTML source" aria-label="HTML source">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.1 4.2L2.4 8l3.7 3.8"/><path d="M9.9 4.2L13.6 8l-3.7 3.8"/></svg>
                </button>
                <button id="vVars" title="Merge fields" aria-label="Merge fields">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.3 2.6c-1.7 0-1.2 4.6-2.9 4.6 1.7 0 1.2 6.2 2.9 6.2"/><path d="M9.7 2.6c1.7 0 1.2 4.6 2.9 4.6-1.7 0-1.2 6.2-2.9 6.2"/></svg>
                </button>
            </div>
            <div class="seg icons" id="deviceSeg" role="group" aria-label="Preview width">
                <button id="vDesktop" class="on" title="Desktop width" aria-label="Desktop width">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.6" y="2.6" width="12.8" height="9" rx="1.5"/><path d="M5.8 14h4.4M8 11.6V14"/></svg>
                </button>
                <button id="vMobile" title="Mobile width" aria-label="Mobile width">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4.6" y="1.8" width="6.8" height="12.4" rx="1.8"/><path d="M7.3 12.3h1.4"/></svg>
                </button>
            </div>
            <div class="spacer"></div>
            <span class="meta" id="tMeta"></span>
            <button class="primary" id="copyBtn">Copy HTML</button>
        </div>
        <div class="view" id="viewPreview"><iframe id="frame" title="Email preview"></iframe></div>
        <pre id="viewHtml" style="display:none"></pre>
        <div class="chips" id="viewVars" style="display:none"></div>
    </section>
</main>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="theme.js"></script>
<!-- For fillSample: this page renders the intended email, not the raw template,
     so it needs the same filler the composer uses. blocks.js is deliberately
     absent — nothing here re-renders a composition, it reads the stored HTML. -->
<script src="sample.js"></script>
<script>
/* Read-only view of everything saved from the composer.
 * No sign-in: the row-level security policy allows anonymous SELECT and nothing
 * else, so this page physically cannot change anything. */

var rows = [], current = null, view = 'preview', suppressHash = false;

function projectLabel(key) {
    return (typeof THEMES !== 'undefined' && THEMES[key] && THEMES[key].label) || key;
}

function renderList() {
    var liveCount = rows.filter(function (r) { return r.is_live; }).length;
    document.getElementById('count').textContent =
        rows.length + ' template' + (rows.length === 1 ? '' : 's') +
        (liveCount ? '  ·  ' + liveCount + ' live' : '');

    if (!rows.length) {
        document.getElementById('list').innerHTML =
            '<div class="empty">No templates yet.<br>Save one from the composer.</div>';
        return;
    }

    var groups = [], byGroup = {};
    rows.forEach(function (r) {
        if (!byGroup[r.project]) { byGroup[r.project] = []; groups.push(r.project); }
        byGroup[r.project].push(r);
    });

    document.getElementById('list').innerHTML = groups.map(function (g) {
        return '<div class="grp">' + projectLabel(g) + '</div>' + byGroup[g].map(function (r) {
            return '<div class="row' + (current && current.id === r.id ? ' on' : '') + '" data-id="' + r.id + '">' +
                '<div class="n">' + esc(r.name) +
                    (r.is_live ? '<span class="live">Live</span>' : '') + '</div>' +
                (r.description ? '<div class="d">' + esc(r.description) + '</div>' : '') +
            '</div>';
        }).join('');
    }).join('');
}

function setView(v) {
    view = v;
    document.getElementById('viewPreview').style.display = v === 'preview' ? 'flex' : 'none';
    document.getElementById('viewHtml').style.display = v === 'html' ? 'block' : 'none';
    document.getElementById('viewVars').style.display = v === 'vars' ? 'block' : 'none';
    document.getElementById('deviceSeg').style.display = v === 'preview' ? 'inline-flex' : 'none';
    [['vPreview', 'preview'], ['vHtml', 'html'], ['vVars', 'vars']].forEach(function (p) {
        document.getElementById(p[0]).classList.toggle('on', v === p[1]);
    });
}

/* The examples whoever built the template filled in, so this page can show the
 * exact intended email instead of a wall of handlebars. They live inside the
 * composition rather than in a column of their own. */
function examplesOf(t) {
    return (t && t.composition && t.composition.examples) || {};
}

function show(id) {
    Api.getTemplate(id).then(function (t) {
        if (!t) return;
        current = t;
        document.getElementById('bar').style.display = 'flex';
        /* So this exact template can be linked to and handed over. */
        if (location.hash.slice(1) !== t.id) {
            suppressHash = true;
            location.hash = t.id;
        }

        var examples = examplesOf(t);

        /* Preview is the email as it is meant to go out: the fixed copy as
         * written, and every remaining merge field standing in for a realistic
         * value. The HTML tab is where you go for the literal template. */
        document.getElementById('frame').srcdoc =
            fillSample(t.html, makeTheme(t.project), examples);
        document.getElementById('viewHtml').textContent = t.html;

        var vars = t.variables || [];
        document.getElementById('viewVars').innerHTML = vars.length
            ? '<p class="meta" style="margin:0 0 14px">Pass these as <code>dynamic_template_data</code>. ' +
              'The example is what the template\u2019s author says belongs in each one. Anything omitted ' +
              'renders as literal {{ }} text in the delivered email.</p>' +
              '<table class="vars"><tr><th>Merge field</th><th>Example value</th></tr>' +
              vars.map(function (v) {
                  var given = examples[v] && String(examples[v]).trim();
                  var fallback = (typeof SAMPLE !== 'undefined' && SAMPLE[v] !== undefined) ? String(SAMPLE[v]) : '';
                  return '<tr><td><code>{{' + esc(v) + '}}</code></td>' +
                      '<td' + (given ? '' : ' class="nx"') + '>' +
                      esc(given ? examples[v] : (fallback || 'not specified')) +
                      (given ? '' : ' <em>(generic)</em>') + '</td></tr>';
              }).join('') + '</table>'
            : '<div class="empty">No merge fields.<br>Every word in this email is fixed copy.</div>';

        document.getElementById('tMeta').textContent =
            (t.sendgrid_template_id ? t.sendgrid_template_id + '  ·  ' : '') +
            (vars.length ? vars.length + ' field' + (vars.length === 1 ? '' : 's') + '  ·  ' : '') +
            (t.html.length / 1024).toFixed(1) + ' KB';
        renderList();
    }).catch(function (e) {
        document.getElementById('viewHtml').textContent = 'Could not load: ' + e.message;
        setView('html');
    });
}

function loadAll() {
    document.getElementById('list').innerHTML = '<div class="empty">Loading…</div>';
    Api.listTemplates().then(function (r) {
        rows = r;
        renderList();
        /* A link straight to one template wins over "show the first one", which
         * is the point of the URL: handing someone a specific email. */
        var wanted = location.hash.slice(1);
        var linked = wanted && rows.some(function (x) { return x.id === wanted; });
        if (linked) show(wanted);
        else if (rows.length && !current) show(rows[0].id);
    }).catch(function (e) {
        document.getElementById('list').innerHTML = '<div class="empty">Could not load:<br>' + e.message + '</div>';
    });
}

/* Back and forward move between templates. suppressHash stops show() writing the
 * hash and immediately reacting to its own write. */
window.addEventListener('hashchange', function () {
    if (suppressHash) { suppressHash = false; return; }
    var id = location.hash.slice(1);
    if (id && (!current || current.id !== id)) show(id);
});

document.getElementById('list').addEventListener('click', function (e) {
    var row = e.target.closest('[data-id]');
    if (row) show(row.getAttribute('data-id'));
});
document.getElementById('reload').addEventListener('click', loadAll);

document.getElementById('vPreview').addEventListener('click', function () { setView('preview'); });
document.getElementById('vHtml').addEventListener('click', function () { setView('html'); });
document.getElementById('vVars').addEventListener('click', function () { setView('vars'); });

document.getElementById('vDesktop').addEventListener('click', function () {
    document.getElementById('frame').classList.remove('mobile');
    this.classList.add('on'); document.getElementById('vMobile').classList.remove('on');
});
document.getElementById('vMobile').addEventListener('click', function () {
    document.getElementById('frame').classList.add('mobile');
    this.classList.add('on'); document.getElementById('vDesktop').classList.remove('on');
});

document.getElementById('copyBtn').addEventListener('click', function () {
    if (!current) return;
    var btn = this;
    var done = function () {
        btn.textContent = 'Copied';
        setTimeout(function () { btn.textContent = 'Copy HTML'; }, 1400);
    };
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(current.html).then(done, done);
    } else {
        var ta = document.createElement('textarea');
        ta.value = current.html; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        done();
    }
});

loadAll();
</script>
</body>
</html>
